name: Build and Push Nuclear UI Nginx Image

on:
  push:
    branches: [production]
    paths:
      - "nuclear/**"
      - ".github/workflows/nuclear-container.yml"
  pull_request:
    paths:
      - "nuclear/**"
      - ".github/workflows/nuclear-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuclear
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuclear/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
        env:
          CHROME_BIN: /usr/bin/google-chrome

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nuclear/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/norkator/porssiohjain-nuclear:latest
