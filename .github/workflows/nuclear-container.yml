name: Build and Push Nuclear Images

on:
  push:
    branches: [production]
    paths:
      - "nuclear/**"
      - ".github/workflows/nuclear-container.yml"
  pull_request:
    paths:
      - "nuclear/**"
      - ".github/workflows/nuclear-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuclear
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuclear/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
        env:
          # Use the executable directly, without the distribution's shell launcher.
          CHROME_BIN: /opt/google/chrome/chrome
      - run: npm run test:browser:companion
        env:
          CHROME_BIN: /opt/google/chrome/chrome

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The backend installs dependencies inside each target architecture.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nuclear/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/norkator/porssiohjain-nuclear:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push session backend
        uses: docker/build-push-action@v7
        with:
          context: ./nuclear
          file: ./nuclear/Dockerfile.sessions
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/norkator/porssiohjain-nuclear-backend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
