version: "3.9"
services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: porssiohjain
      POSTGRES_PASSWORD: porssiohjain
      POSTGRES_DB: porssiohjain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    ports:
      - "1883:1883"
      - "8883:8883"
      - "15673:15672"
    volumes:
      - ./compose/rabbitmq.local-dev.config:/etc/rabbitmq/rabbitmq.config:ro
      - ./compose/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # - /opt/rabbitmq-certs:/etc/rabbitmq/certs:ro
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    restart: "no"

  device-simulator:
    image: ghcr.io/norkator/porssiohjain-device-simulator:latest
    build:
      context: ./device-simulator
    profiles:
      - simulator
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8080}
      # Share this private token with the host backend. The simulator validates it at startup.
      DEVICE_SIMULATOR_TOKEN: ${DEVICE_SIMULATOR_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DEVICE_SIMULATOR_PORT:-8081}:8080"
    volumes:
      - simulator_data:/data

volumes:
  postgres_data:
  simulator_data:
