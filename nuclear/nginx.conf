server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Relative redirects retain HTTPS when TLS terminates at the reverse proxy.
    absolute_redirect off;

    # Inspect the original request so directory index resolution cannot loop.
    if ($request_uri ~ "^(/(?:guides/[^/]+/)?)index\.html(?:\?|$)") {
        return 301 $1$is_args$args;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /audio/ {
        try_files $uri =404;
    }

    location / {
        # This app has no client-side routes. Missing pages must be real 404s.
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
