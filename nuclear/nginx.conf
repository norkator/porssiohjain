server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Relative redirects retain HTTPS when TLS terminates at the reverse proxy.
    absolute_redirect off;

    # Resolve at request time so the original static-only container still starts
    # without the optional session service. Docker Compose provides this name.
    location = /session {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $session_backend http://session-server:8081;
        proxy_pass $session_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Inspect the original request so directory index resolution cannot loop.
    if ($request_uri ~ "^(/(?:(?:guides/[^/]+|reactor|companion)/)?)index\.html(?:\?|$)") {
        return 301 $1$is_args$args;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /audio/ {
        try_files $uri =404;
    }

    location / {
        # Landing, guides and consoles have separate static entries. Unknown pages stay 404s.
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
