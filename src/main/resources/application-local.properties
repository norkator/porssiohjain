# Disposable local testing only. run-local.sh loads this instead of application.properties.
spring.application.name=porssiohjain-local
server.address=127.0.0.1
server.port=8080
vaadin.launch-browser=false
spring.devtools.restart.enabled=false
spring.messages.encoding=UTF-8

# Each application start gets a new database. PostgreSQL migrations are intentionally skipped.
spring.datasource.url=jdbc:h2:mem:local-${random.uuid};MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.h2.console.enabled=false

app.crypto.key=local-testing-only-key
app.cors.allow-all=false
app.auth.refresh-token-lifetime-days=7
app.alerts.mail=local@example.invalid
app.alerts.admin-mail=admin@example.invalid
resent.api-key=local-testing-disabled
app.push.fcm.enabled=false
app.push.error-alerts.enabled=false
app.billing.google-play.verification-mode=disabled
app.outbound-proxy.enabled=false
app.device-simulator.base-url=
app.device-simulator.token=

# No background jobs, broker, API credentials or external services are needed.
mqtt.enabled=false
fingrid.api-enabled=false
fingrid.api-key=
fingrid.wind-power-forecast-api-url=https://data.fingrid.fi/api/datasets/245/data
fingrid.delete-data-after-months=5
fmi.api-enabled=false
nordpool.day-ahead-prices-api-url=https://dataportal-api.nordpoolgroup.com/api/DayAheadPriceIndices
nordpool.delete-data-after-months=12
solarman.poll-interval=15m
